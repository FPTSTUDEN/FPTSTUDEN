<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" width="640" height="418" role="img" aria-label="Traveler mail inbox styled like an airport arrivals board: black and yellow rows listing messages left by travelers from Osaka, São Paulo, Bengaluru, Helsinki, Madrid and Austin, each with a three-letter airport code, time and status." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg{fill:#0B0B0C}.y{fill:#FFC82C}.panel{fill:#1C1C1E}
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
    .title{font-weight:700;font-size:19px;fill:#0B0B0C}
    .sub{font-weight:600;font-size:9.5px;letter-spacing:1.3px;fill:#0B0B0C;opacity:.75}
    .big{font-weight:700;font-size:22px;fill:#0B0B0C;text-anchor:end}
    .col{font-weight:700;font-size:9px;letter-spacing:1.6px;fill:#FFC82C}
    .code{font-weight:700;font-size:13px;fill:#0B0B0C;text-anchor:middle;letter-spacing:1px}
    .nm{font-weight:700;font-size:13px;letter-spacing:.4px}
    .meta{font-weight:600;font-size:8.5px;letter-spacing:1.1px;fill:#8E8E93}
    .msg{font-size:13px}
    .tm{font-size:11px;fill:#8E8E93;text-anchor:end}
    .chip{font-weight:700;font-size:8.5px;letter-spacing:1.4px;text-anchor:middle}
    .dv{stroke:#2A2A2C;stroke-width:1;stroke-dasharray:3 3}
    .field{fill:#151516;stroke:#333336;stroke-width:1}
    .ph{font-size:13px;fill:#6D6D72}
  </style>
  <defs>
    <clipPath id="c"><rect width="640" height="418" rx="18"/></clipPath>
    <pattern id="haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#FFC82C"/><rect x="6" width="6" height="12" fill="#0B0B0C"/></pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect class="bg" width="640" height="418"/>
    <!-- header -->
    <rect class="y" width="640" height="72"/>
    <circle cx="38" cy="36" r="17" fill="#0B0B0C"/>
    <rect x="26" y="28" width="24" height="16" rx="2.5" fill="none" stroke="#FFC82C" stroke-width="1.8"/>
    <path d="M27 30 L38 38 L49 30" fill="none" stroke="#FFC82C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text class="title sans" x="66" y="34">Traveler mail</text>
    <text class="sub sans" x="66" y="52">ARRIVALS HALL · LEAVE A MESSAGE BEFORE YOU GO</text>
    <text class="big mono" x="600" y="38">03</text>
    <text class="sub sans" x="600" y="54" text-anchor="end">NEW</text>
    <!-- column strip -->
    <rect y="72" width="640" height="22" fill="#151516"/>
    <text class="col sans" x="20" y="87">FROM</text>
    <text class="col sans" x="200" y="87">MESSAGE</text>
    <text class="col sans" x="546" y="87" text-anchor="end">TIME</text>
    <text class="col sans" x="590" y="87" text-anchor="middle">STATUS</text>
    <!-- rows -->
    <rect class="panel" x="0" y="94" width="640" height="52"/><rect class="y" x="0" y="94" width="4" height="52"/>
    <rect class="y" x="20" y="105" width="44" height="30" rx="3"/><text class="code mono" x="42" y="125">KIX</text>
    <text class="nm sans" x="76" y="119" style="fill:#F2F2F3">AIKO</text><text class="meta sans" x="76" y="133">OSAKA, JP</text>
    <text class="msg sans" x="200" y="125" style="fill:#F2F2F3;font-weight:600">Loved the arrival animation. So smooth.</text>
    <text class="tm mono" x="546" y="125">18:02</text>
    <rect class="y" x="560" y="111" width="60" height="18" rx="3"/><text class="chip sans" x="590" y="123.5" style="fill:#0B0B0C">NEW</text>
    <line class="dv" x1="0" y1="146" x2="640" y2="146"/>
    <rect class="panel" x="0" y="146" width="640" height="52"/><rect class="y" x="0" y="146" width="4" height="52"/>
    <rect class="y" x="20" y="157" width="44" height="30" rx="3"/><text class="code mono" x="42" y="177">GRU</text>
    <text class="nm sans" x="76" y="171" style="fill:#F2F2F3">LUCAS</text><text class="meta sans" x="76" y="185">SÃO PAULO, BR</text>
    <text class="msg sans" x="200" y="177" style="fill:#F2F2F3;font-weight:600">Found your repo through the stamp. Neat!</text>
    <text class="tm mono" x="546" y="177">17:48</text>
    <rect class="y" x="560" y="163" width="60" height="18" rx="3"/><text class="chip sans" x="590" y="175.5" style="fill:#0B0B0C">NEW</text>
    <line class="dv" x1="0" y1="198" x2="640" y2="198"/>
    <rect class="y" x="20" y="209" width="44" height="30" rx="3"/><text class="code mono" x="42" y="229">BLR</text>
    <text class="nm sans" x="76" y="223" style="fill:#B8B8BC">PRIYA</text><text class="meta sans" x="76" y="237">BENGALURU, IN</text>
    <text class="msg sans" x="200" y="229" style="fill:#8E8E93;font-weight:400">Quick question about the terminal D docs.</text>
    <text class="tm mono" x="546" y="229">16:30</text>
    <rect x="560.75" y="215.75" width="58.5" height="16.5" rx="3" fill="none" stroke="#FFC82C" stroke-width="1.5"/><text class="chip sans" x="590" y="227.5" style="fill:#FFC82C">REPLIED</text>
    <line class="dv" x1="0" y1="250" x2="640" y2="250"/>
    <rect class="y" x="20" y="261" width="44" height="30" rx="3"/><text class="code mono" x="42" y="281">HEL</text>
    <text class="nm sans" x="76" y="275" style="fill:#B8B8BC">MATTIAS</text><text class="meta sans" x="76" y="289">HELSINKI, FI</text>
    <text class="msg sans" x="200" y="281" style="fill:#8E8E93;font-weight:400">Great hackathon notes, thanks for sharing.</text>
    <text class="tm mono" x="546" y="281">15:12</text>
    <text class="chip sans" x="590" y="279.5" style="fill:#6D6D72">READ</text>
    <line class="dv" x1="0" y1="302" x2="640" y2="302"/>
    <rect class="panel" x="0" y="302" width="640" height="52"/><rect class="y" x="0" y="302" width="4" height="52"/>
    <rect class="y" x="20" y="313" width="44" height="30" rx="3"/><text class="code mono" x="42" y="333">MAD</text>
    <text class="nm sans" x="76" y="327" style="fill:#F2F2F3">SOFIA</text><text class="meta sans" x="76" y="341">MADRID, ES</text>
    <text class="msg sans" x="200" y="333" style="fill:#F2F2F3;font-weight:600">Can we collaborate on a mini project?</text>
    <text class="tm mono" x="546" y="333">12:55</text>
    <rect class="y" x="560" y="319" width="60" height="18" rx="3"/><text class="chip sans" x="590" y="331.5" style="fill:#0B0B0C">NEW</text>
    <line class="dv" x1="0" y1="354" x2="640" y2="354"/>
    <rect class="y" x="20" y="365" width="44" height="30" rx="3"/><text class="code mono" x="42" y="385">AUS</text>
    <text class="nm sans" x="76" y="379" style="fill:#B8B8BC">TOM</text><text class="meta sans" x="76" y="393">AUSTIN, US</text>
    <text class="msg sans" x="200" y="385" style="fill:#8E8E93;font-weight:400">Just passing through. Nice banner!</text>
    <text class="tm mono" x="546" y="385">09:41</text>
    <text class="chip sans" x="590" y="383.5" style="fill:#6D6D72">READ</text>
    <line class="dv" x1="0" y1="406" x2="640" y2="406"/>
    <!-- closing hazard strip -->
    <rect x="0" y="412" width="640" height="6" fill="url(#haz)"/>
  </g>
  <rect x=".75" y=".75" width="638.5" height="416.5" rx="17.5" fill="none" stroke="#2A2A2C" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
