<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="Welcome to Terminal A. This is where the projects live. Every gate is a repo: pick one, check its status, and board when you're ready. Gates A1 to A6." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
    .eyebrow{font-weight:700;font-size:10px;letter-spacing:2px;fill:#FFC82C}
    .h{font-weight:700;font-size:28px;fill:#F2F2F3;letter-spacing:-.2px}
    .p{font-weight:400;font-size:14px;fill:#B8B8BC}
  </style>
  <defs>
    <clipPath id="c"><rect width="640" height="140" rx="18"/></clipPath>
    <pattern id="haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#FFC82C"/><rect x="6" width="6" height="12" fill="#0B0B0C"/></pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="140" fill="#0B0B0C"/>
    <rect width="5" height="134" fill="#FFC82C"/>
    <rect y="134" width="640" height="6" fill="url(#haz)"/>
    <!-- eyebrow chip -->
    <rect x="28" y="24" width="132" height="22" rx="4" fill="#1C1C1E"/>
    <circle cx="42" cy="35" r="3.5" fill="#FFC82C"/>
    <text class="eyebrow sans" x="52" y="39">NOW BOARDING</text>
    <!-- headline -->
    <text class="h sans" x="28" y="82">Welcome to <tspan fill="#FFC82C">Terminal A</tspan></text>
    <text class="p sans" x="28" y="104">This is where the projects live. Every gate is a repo: pick</text>
    <text class="p sans" x="28" y="123">one, check its status, and board when you're ready.</text>
    <!-- gate tag -->
    <rect x="504" y="24" width="108" height="22" rx="4" fill="none" stroke="#FFC82C" stroke-width="1.5"/>
    <text class="eyebrow mono" x="558" y="39" text-anchor="middle">GATES A1–A6</text>
  </g>
  <rect x=".75" y=".75" width="638.5" height="138.5" rx="17.5" fill="none" stroke="#2A2A2C" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
