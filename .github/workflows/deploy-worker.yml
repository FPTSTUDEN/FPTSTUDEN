name: Deploy Worker

on:
  push:
    branches: [refactor-airport-style]
    paths:
      - 'airport-welcomer/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./airport-welcomer
    steps:
      - uses: actions/checkout@v4

      # 1. Add this step to install pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # or your preferred version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # Optional: enables caching for faster installs
          cache-dependency-path: airport-welcomer/pnpm-lock.yaml

      # (Optional) If you need to install dependencies explicitly
      # - name: Install dependencies
      #   run: pnpm install

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./airport-welcomer
          command: deploy
          packageManager: npm