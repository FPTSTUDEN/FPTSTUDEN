name: Traveler mail

# Redraws traveler-mail.svg from the repo's issues whenever a "[hello]" or
# "[message]" issue is opened, edited, replied to by staff, closed, labelled
# or deleted. Run it by hand from the Actions tab to rebuild on demand.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write   # commit the rebuilt SVG
  issues: write     # post the welcome comment

# One rebuild at a time. The script redraws from all issues every run, so a
# skipped pending run is harmless: the next one picks everything up.
concurrency:
  group: traveler-mail
  cancel-in-progress: false

env:
  # "true" = only issues labelled "approved" appear (you moderate first).
  # Issues labelled "hidden" never appear either way.
  REQUIRE_APPROVAL: "false"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.event.issue.title, '[hello]') ||
        startsWith(github.event.issue.title, '[message]')) &&
       (github.event_name != 'issue_comment' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_inbox.py

      - name: Commit the board
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traveler-mail.svg
          if git diff --cached --quiet; then
            echo "Board unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(board): update traveler mail"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((attempt * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Welcome the traveler
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$REQUIRE_APPROVAL" = "true" ]; then
            BODY="Thanks for stopping by! Messages appear on the arrivals board once they have been approved."
          else
            BODY="Thanks for stopping by! Your arrival is on the board. It can take a minute or two to show up in the README."
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
