name: Generate and Deploy Date Image v2

on:
  schedule:
    - cron: '0 0 * * *'  # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_date.py'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pillow
          
      - name: Generate date image
        run: |
          python scripts/generate_date.py
          # Your script should output to public/date-image.png
          # mkdir -p public
          # Move your generated image to public folder
          # mv date-image.png public/date-image.png
          
      - name: Rewrite lastest commit (avoid flooding commit history)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add public/date-image.png
          git commit --amend --no-edit || echo "No changes to commit"
          git push --force
