name: Generate and Deploy Date Image v2

on:
  schedule:
    - cron: '0 0 * * *'  # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_date.py'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for amend to work
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pillow
          
      - name: Generate date image
        run: |
          python scripts/generate_date.py
          # Your script should output to public/date-image.png
          # mkdir -p public
          # Move your generated image to public folder
          # mv date-image.png public/date-image.png
          
      - name: Configure Git for amend
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
      - name: Add and amend commit
        run: |
          # Check if date-image.png exists
          if [ -f "date-image.png" ]; then
            git add date-image.png
            
            # Check if we have any commits in this branch
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              # Amend the last commit
              git commit --amend --no-edit --allow-empty
              # Force push (only if we're allowed)
              git push --force-with-lease origin HEAD
            else
              # First commit
              git commit -m "Add date image"
              git push
            fi
          else
            echo "No date image generated"
            exit 1
          fi