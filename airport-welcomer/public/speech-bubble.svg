<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <!-- Bubble body: rounded rectangle with a tail pointing down-left -->
  <g id="speech-bubble">
    <path
      d="M 20 20
         Q 20 10 30 10
         L 370 10
         Q 380 10 380 20
         L 380 110
         Q 380 120 370 120
         L 120 120
         L 80 150
         L 84 120
         L 30 120
         Q 20 120 20 110
         Z"
      fill="#ffffff"
      stroke="#2b2b2b"
      stroke-width="2"
      stroke-linejoin="round"/>

    <!-- Text lines: add or remove <tspan> rows as needed -->
    <text x="36" y="44" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b">
      <tspan x="36" dy="0">Welcome. Purpose of visit?</tspan>
      <tspan x="36" dy="22">Building things in public.</tspan>
      <tspan x="36" dy="22">Please proceed to the next desk.</tspan>
    </text>
  </g>
</svg>