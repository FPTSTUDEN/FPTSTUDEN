<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 132" width="640" height="132" role="img" aria-label="Airport sign: Post Office. Traveler mail, say hello, leave a note. Airmail-striped border, envelope icon and a down arrow pointing to the inbox below." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .t{font-weight:700;font-size:34px;letter-spacing:-.3px;fill:#0B0B0C}
    .s{font-weight:600;font-size:10px;letter-spacing:1.6px;fill:#0B0B0C;opacity:.78}
  </style>
  <defs>
    <!-- airmail stripes: red, white, blue, white -->
    <pattern id="air" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#F2F5F8"/>
      <rect width="8" height="24" fill="#E5484D"/>
      <rect x="12" width="8" height="24" fill="#0A4DB0"/>
    </pattern>
  </defs>
  <!-- hanging rods -->
  <rect x="118" y="0" width="4" height="22" fill="#3A3A3D"/><rect x="518" y="0" width="4" height="22" fill="#3A3A3D"/>
  <rect x="112" y="0" width="16" height="5" rx="1" fill="#4A4A4E"/><rect x="512" y="0" width="16" height="5" rx="1" fill="#4A4A4E"/>
  <!-- sign + airmail border -->
  <rect x="1" y="20" width="638" height="108" rx="16" fill="#F2F5F8"/>
  <rect x="5" y="24" width="630" height="100" rx="12" fill="none" stroke="url(#air)" stroke-width="8"/>
  <!-- envelope tile -->
  <rect x="28" y="42" width="64" height="64" rx="10" fill="#0A4DB0"/>
  <g transform="translate(60 74)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-11" width="32" height="22" rx="3.5"/>
    <path d="M-15 -9 L0 3 L15 -9"/>
  </g>
  <!-- text -->
  <text class="t sans" x="112" y="78">Post Office</text>
  <text class="s sans" x="113" y="98">TRAVELER MAIL  ·  SAY HELLO  ·  LEAVE A NOTE</text>
  <!-- arrow tile (points down to the inbox) -->
  <rect x="548" y="42" width="64" height="64" rx="10" fill="#0A4DB0"/>
  <path d="M580 58 V90 M566 78 L580 92 L594 78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
